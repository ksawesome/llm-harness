[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness"
version = "0.1.0"
description = "LLM Benchmarking Harness for evaluating language models"
authors = [
    {name = "ksawesome", email = "your-email@example.com"},
]
dependencies = [
    "anthropic>=0.40.0",
    "cohere>=5.0.0",
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "plotly>=5.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "flask>=3.0.0",
    "tqdm>=4.64.0",
]
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools]
packages = ["adapters", "analysis"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"