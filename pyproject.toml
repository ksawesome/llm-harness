[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness"
version = "0.1.0"
description = "LLM Benchmarking Harness for evaluating language models"
authors = [
    {name = "ksawesome", email = "your-email@example.com"},
]
dependencies = [
    "anthropic==0.69.0",
    "cohere==5.18.0",
    "google-generativeai==0.8.5",
    "openai==1.54.3",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "ipykernel==6.29.5",
    "matplotlib==3.9.2",
    "numpy==1.26.4",
    "plotly==5.24.1",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.4",
    "pydantic==2.9.2",
    "tenacity==9.0.0",
    "flask==3.0.4",
    "tqdm==4.67.0",
    "tiktoken==0.8.0",
    "jsonschema==4.23.0",
    "jinja2==3.1.4",
    "reportlab==4.2.2",
]
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
    "sphinx>=7.0.0",
]
viz = [
    "plotly==5.24.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
]

[tool.setuptools]
packages = ["adapters", "analysis"]

[tool.black]
line-length = 79
target-version = ['py39']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
